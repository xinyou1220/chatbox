<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>溫柔女友聊天機器人</title>
  <style>
    body { font-family: sans-serif; background: #fffafc; padding: 2em; }
    #chatbox { max-width: 600px; margin: auto; border: 1px solid #ddd; padding: 1em; background: #fff; border-radius: 8px; }
    .msg { margin: 1em 0; }
    .user { text-align: right; color: #333; }
    .bot { text-align: left; color: #d17aa9; }
    input, button { padding: 0.5em; }
  </style>
</head>
<body>
  <div id="chatbox">
    <div class="msg bot">嗨寶貝～今天想聊什麼呢？💕</div>
  </div>
  <div style="max-width:600px; margin:auto; margin-top:1em;">
    <input id="input" type="text" placeholder="輸入訊息..." style="width:75%">
    <button onclick="sendMessage()">傳送</button>
  </div>

  <script>
    const API_KEY = "AIzaSyBTeAIZPOXZyLV3raGJV-zv6vgPGoZmkjo"; // <-- 請換成你自己的
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('input');
    
    let messages = [
      {
        role: "user",
        parts: [{ text: "妳是一個溫柔、體貼的女朋友，喜歡用貼心的話安慰人，現在開始我們的對話。" }]
      }
    ];

    async function sendMessage() {
      const userInput = input.value.trim();
      if (!userInput) return;

      // 顯示使用者訊息
      appendMessage('user', userInput);
      input.value = "";

      messages.push({
        role: "user",
        parts: [{ text: userInput }]
      });

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: messages })
        }
      );

      const data = await response.json();
      const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "嗯嗯～我聽不太懂耶寶貝，再說一次好嗎？🥺";

      appendMessage('bot', botReply);

      messages.push({
        role: "model",
        parts: [{ text: botReply }]
      });
    }

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = 'msg ' + sender;
      msg.textContent = text;
      chatbox.appendChild(msg);
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
